name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'Travel_Ease_Backend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

defaults:
  run:
    working-directory: Travel_Ease_Backend

env:
  NODE_VERSION: '20'

jobs:
  # Run tests before any deployment
  test:
    name: Pre-deployment Tests
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: test
      JWT_SECRET: test-secret-key-for-ci
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travelease_test
      NODE_TLS_REJECT_UNAUTHORIZED: '0'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travelease_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Travel_Ease_Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to database
        run: npx prisma db push --skip-generate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Travel_Ease_Backend/coverage
          retention-days: 7

  # Build and prepare deployment artifacts
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Travel_Ease_Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: Travel_Ease_Backend/dist
          retention-days: 7

  # Deploy to staging environment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment: staging
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: Travel_Ease_Backend/dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # TODO: Add your deployment commands here
      # Examples:
      # - Deploy to Vercel: vercel deploy --prod
      # - Deploy to Railway: railway up
      # - Deploy to Render: (automatic via webhook)
      # - Deploy to AWS: aws ecs update-service ...
      - name: Deploy to staging
        run: |
          echo "Deployment would happen here"
          echo "Build artifacts ready in dist/"
          echo "Environment: staging"

      # Run smoke tests after deployment
      - name: Wait for deployment
        run: sleep 10

      - name: Smoke test - Health check
        run: |
          echo "Smoke test: Check if staging server is responding"
          # curl -f ${{ secrets.STAGING_URL }}/api/health || exit 1
          echo "Smoke tests passed (placeholder)"

  # Deploy to production (manual trigger only or after staging success)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event.inputs.environment == 'production'
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: Travel_Ease_Backend/dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # TODO: Add your production deployment commands here
      - name: Deploy to production
        run: |
          echo "Production deployment would happen here"
          echo "Build artifacts ready in dist/"
          echo "Environment: production"

      # Run smoke tests after production deployment
      - name: Wait for deployment
        run: sleep 10

      - name: Smoke test - Health check
        run: |
          echo "Production smoke test: Check if server is responding"
          # curl -f ${{ secrets.PRODUCTION_URL }}/api/health || exit 1
          echo "Production smoke tests passed (placeholder)"

      - name: Notify on success
        if: success()
        run: |
          echo "Deployment to production successful!"
          # Add Slack/Discord notification here if needed

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment to production failed!"
          # Add Slack/Discord notification here if needed

