# =============================================================================
# TravelEase Nginx Configuration
# =============================================================================
# This configuration provides:
# - HTTP to HTTPS redirect
# - TLS termination with modern security settings
# - Gzip compression for static assets and API responses
# - CDN-friendly cache headers
# - Reverse proxy for API requests to Node.js backend
#
# PLACEHOLDERS TO REPLACE:
# - YOUR_DOMAIN          -> your actual domain (e.g., travelease.example.com)
# - /path/to/fullchain.pem -> SSL certificate path
# - /path/to/privkey.pem   -> SSL private key path
# - /var/www/travelease/frontend -> path to Vite build output
# =============================================================================

# -----------------------------------------------------------------------------
# Upstream: Backend API Server
# -----------------------------------------------------------------------------
# The Node.js/Express backend runs on localhost:3001
# This upstream block allows for easy configuration changes and load balancing
upstream travelease_backend {
    server 127.0.0.1:3001;
    
    # Keepalive connections for better performance
    keepalive 32;
}

# -----------------------------------------------------------------------------
# HTTP Server (Port 80) - Redirect to HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Redirect all HTTP traffic to HTTPS
    # 301 = permanent redirect (browsers will cache this)
    return 301 https://$server_name$request_uri;
}

# -----------------------------------------------------------------------------
# HTTPS Server (Port 443) - Main Application
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # =========================================================================
    # SSL/TLS Configuration
    # =========================================================================
    
    # Certificate files (Let's Encrypt or other CA)
    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    # Modern TLS protocols only (TLS 1.2 and 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong cipher suite - prefer server ciphers
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # SSL session caching for performance
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling - improves SSL handshake performance
    ssl_stapling on;
    ssl_stapling_verify on;
    # Uncomment and set if you have a trusted CA bundle:
    # ssl_trusted_certificate /path/to/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # =========================================================================
    # Security Headers
    # =========================================================================
    
    # HSTS - Force HTTPS for 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS Protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =========================================================================
    # Gzip Compression
    # =========================================================================
    
    # Enable gzip compression
    gzip on;
    
    # Compress responses for proxied requests too (API responses)
    gzip_proxied any;
    
    # Add Vary: Accept-Encoding header for CDN compatibility
    gzip_vary on;
    
    # Compression level (1-9, 6 is a good balance)
    gzip_comp_level 6;
    
    # Minimum response size to compress (bytes)
    gzip_min_length 256;
    
    # Buffer settings for compression
    gzip_buffers 16 8k;
    
    # HTTP version for compression
    gzip_http_version 1.1;
    
    # MIME types to compress
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/opentype
        font/ttf
        font/eot
        font/otf;

    # =========================================================================
    # Root Directory - Frontend Static Files
    # =========================================================================
    
    # Point to the Vite build output directory
    root /var/www/travelease/frontend;
    index index.html;

    # =========================================================================
    # Location Blocks
    # =========================================================================

    # -------------------------------------------------------------------------
    # API Proxy - Forward /api/* requests to Node.js backend
    # -------------------------------------------------------------------------
    location /api/ {
        # Proxy to upstream backend
        proxy_pass http://travelease_backend;
        
        # HTTP version for keepalive
        proxy_http_version 1.1;
        
        # Headers for proper proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Disable caching for API responses
        # Dynamic data should always be fresh
        add_header Cache-Control "no-store" always;
        
        # Remove any existing cache headers from backend
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
    }

    # -------------------------------------------------------------------------
    # Static Assets - Vite hashed files (long-term caching)
    # -------------------------------------------------------------------------
    # Vite generates files with content hashes like: index-DUHZzStB.js
    # These can be cached indefinitely since the hash changes when content changes
    location /assets/ {
        # Long-term caching: 1 year, immutable
        # immutable tells browsers the file will never change
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        
        # Enable gzip for assets (inherited from server block)
        gzip_static on;
        
        # Try to serve pre-compressed .gz files if available
        # Falls back to regular file if no .gz exists
        try_files $uri $uri/ =404;
        
        # Access logging can be disabled for static assets to reduce log noise
        # access_log off;
    }

    # -------------------------------------------------------------------------
    # Other Static Files - Images, fonts, etc. at root level
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|webp|avif)$ {
        # Long-term caching for fingerprinted assets
        # For non-fingerprinted files, use shorter cache
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        
        # Try to serve the file
        try_files $uri =404;
        
        # Access logging can be disabled for static assets
        # access_log off;
    }

    # -------------------------------------------------------------------------
    # HTML and SPA Fallback
    # -------------------------------------------------------------------------
    location / {
        # No caching for HTML - users should always get fresh version
        # This ensures they get the latest app version with updated asset references
        add_header Cache-Control "no-store" always;
        
        # SPA routing: try file, then directory, then fall back to index.html
        # This allows React Router to handle client-side routing
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Favicon - special handling
    # -------------------------------------------------------------------------
    location = /favicon.ico {
        # Cache favicon for 1 week
        add_header Cache-Control "public, max-age=604800" always;
        log_not_found off;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Robots.txt
    # -------------------------------------------------------------------------
    location = /robots.txt {
        # Cache for 1 day
        add_header Cache-Control "public, max-age=86400" always;
        log_not_found off;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Security: Block access to sensitive files
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to backup files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # Logging
    # =========================================================================
    
    # Access log with combined format
    access_log /var/log/nginx/travelease.access.log combined;
    
    # Error log
    error_log /var/log/nginx/travelease.error.log warn;

    # =========================================================================
    # Error Pages (optional)
    # =========================================================================
    
    # Custom error pages (uncomment if you have custom error pages)
    # error_page 404 /404.html;
    # error_page 500 502 503 504 /50x.html;
    # location = /50x.html {
    #     root /var/www/travelease/frontend;
    # }
}

