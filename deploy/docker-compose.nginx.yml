# =============================================================================
# TravelEase Docker Compose - Nginx + Backend
# =============================================================================
# This compose file sets up:
# - Nginx as a reverse proxy (ports 80, 443)
# - Node.js backend API (internal port 3001)
#
# Prerequisites:
# - SSL certificates in ./certs/ or mounted from host
# - Frontend build in ./frontend-build/ or mounted from host
# - Backend .env file with DATABASE_URL and other secrets
#
# Usage:
#   docker compose -f deploy/docker-compose.nginx.yml up -d
#
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: travelease-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx configuration
      - ./nginx/travelease.conf:/etc/nginx/conf.d/default.conf:ro
      
      # SSL certificates (mount from host or use certbot container)
      # Uncomment and adjust paths as needed:
      # - /etc/letsencrypt/live/your-domain.com/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      # - /etc/letsencrypt/live/your-domain.com/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      
      # For local development/testing, you can use self-signed certs:
      - ./certs:/etc/nginx/ssl:ro
      
      # Frontend static files (Vite build output)
      - ./frontend-build:/var/www/travelease/frontend:ro
      
      # Nginx logs (optional - for debugging)
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
    networks:
      - travelease-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Node.js Backend API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../Travel_Ease_Backend
      dockerfile: Dockerfile
    container_name: travelease-backend
    restart: unless-stopped
    # Internal port - not exposed to host, only accessible via Nginx
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Database URL - set in .env file or override here
      - DATABASE_URL=${DATABASE_URL}
      # Supabase configuration
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      # JWT secret for token signing
      - JWT_SECRET=${JWT_SECRET}
      # Cloudinary (if used)
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      # Map provider
      - MAP_PROVIDER=${MAP_PROVIDER:-osm}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    volumes:
      # Mount node_modules as anonymous volume to use container's modules
      - /app/node_modules
    networks:
      - travelease-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  travelease-network:
    driver: bridge

